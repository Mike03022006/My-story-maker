<div class="story-reader-overlay" (click)="onClose()">
  <div class="story-reader-container" (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="story-header">
      <button class="close-button" (click)="onClose()">
        <ion-icon name="close"></ion-icon>
      </button>
      <button class="favorite-button" (click)="toggleFavorite.emit(story)">
        <ion-icon [name]="story.isFavorite ? 'heart' : 'heart-outline'"></ion-icon>
      </button>
    </div>

    <!-- Story Image (if available) -->
    <div class="story-image-container" *ngIf="story.imageUrl">
      <img [src]="story.imageUrl" [alt]="story.title" class="story-image" />
    </div>

    <!-- Story Cover (emoji fallback) -->
    <div class="story-cover" *ngIf="!story.imageUrl">
      <div class="cover-emoji">{{ story.cover }}</div>
    </div>

    <!-- Story Content -->
    <div class="story-content">
      <h1 class="story-title">{{ story.title }}</h1>
      
      <div class="story-meta" *ngIf="story.isAIGenerated">
        <span class="ai-badge">
          <ion-icon name="sparkles"></ion-icon>
          Generada por IA
        </span>
        <span class="genre-badge">{{ getGenreLabel(story.genre) }}</span>
      </div>

      <div class="story-details" *ngIf="story.characters || story.setting">
        <div class="detail-item" *ngIf="story.characters && story.characters.length > 0">
          <ion-icon name="people"></ion-icon>
          <span>{{ story.characters.join(', ') }}</span>
        </div>
        <div class="detail-item" *ngIf="story.setting">
          <ion-icon name="location"></ion-icon>
          <span>{{ story.setting }}</span>
        </div>
      </div>

      <div class="story-text">
        {{ story.content }}
      </div>
    </div>

    <!-- Audio Controls -->
    <div class="audio-controls">
      <button 
        class="audio-button" 
        [class.reading]="isReading"
        (click)="toggleReading()">
        <ion-icon [name]="isReading ? 'pause-circle' : 'play-circle'"></ion-icon>
        <span>{{ isReading ? 'Pausar lectura' : 'Leer historia' }}</span>
      </button>
    </div>

  </div>
</div>
